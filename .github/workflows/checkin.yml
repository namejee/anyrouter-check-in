name: AnyRouter 自动签到
on:
  schedule:
    # GitHub Actions cron 使用 UTC；下列时点对应北京时间。
    # 避开整点和半点高峰：08:07、08:37、09:07、12:07、18:37、22:37。
    # 每个目标后 10 分钟补跑一次；GitHub 定时触发在高负载时可能延迟或漏触发。
    - cron: '7,17 0,1 * * *'
    - cron: '37,47 0 * * *'
    - cron: '7,17 4 * * *'
    - cron: '37,47 10 * * *'
    - cron: '37,47 14 * * *'
  workflow_dispatch:

concurrency:
  group: anyrouter-check-in-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: windows-2025
    timeout-minutes: 10
    environment: production
    env:
      PYTHONIOENCODING: utf-8
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 缓存 UV 依赖
      uses: actions/cache@v4
      id: uv-cache
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 安装依赖
      if: steps.uv-cache.outputs.cache-hit != 'true'
      run: |
        echo "缓存未命中，开始安装项目依赖..."
        uv sync
        echo "✅ 环境初始化完成"

    - name: 获取 Playwright 版本
      id: playwright-version
      run: |
        $version = uv run python -c "import importlib.metadata; print(importlib.metadata.version('playwright'))"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Playwright version: $version"

    - name: 缓存 Playwright 浏览器
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~\AppData\Local\ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: 安装 Playwright 浏览器
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        echo "缓存未命中，开始安装 Playwright 浏览器..."
        uv run playwright install chromium --with-deps

    - name: 恢复余额历史缓存
      id: balance-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: |
          balance_hash.txt
          balance_history.json
        key: balance-hash-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          balance-hash-

    - name: 恢复每日到账记录
      uses: actions/cache/restore@v4
      with:
        path: balance_daily.json
        key: balance-daily-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          balance-daily-

    - name: 执行签到
      id: checkin
      env:
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
        BARK_KEY: ${{ secrets.BARK_KEY }}
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
      run: |
        uv run checkin.py

    - name: 保存余额历史缓存
      if: always() && hashFiles('balance_hash.txt') != ''
      uses: actions/cache/save@v4
      with:
        path: |
          balance_hash.txt
          balance_history.json
        key: balance-hash-${{ github.run_id }}-${{ github.run_attempt }}

    - name: 保存每日到账记录
      if: always() && hashFiles('balance_daily.json') != ''
      uses: actions/cache/save@v4
      with:
        path: balance_daily.json
        key: balance-daily-${{ github.run_id }}-${{ github.run_attempt }}

    - name: 归档到账记录（不含凭据）
      if: always() && hashFiles('balance_daily.json') != ''
      uses: actions/upload-artifact@v4
      with:
        name: balance-daily-${{ github.run_id }}-${{ github.run_attempt }}
        path: balance_daily.json
        retention-days: 90

    - name: 执行结果
      if: always()
      run: |
        echo "签到任务执行完成"
        echo "时间: $(Get-Date)"
        echo "触发方式: ${{ github.event_name }}; UTC cron: ${{ github.event.schedule }}" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
        if ("${{ steps.checkin.outcome }}" -ne "success") {
          echo "签到脚本报告失败，workflow 将标记为失败。" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          echo "" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          echo "- 至少一个账号的 Cookie、api_user 或 WAF 状态需要更新" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          echo "- 查看 '执行签到' 步骤日志获取具体失败原因" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
        } else {
          echo "全部账号执行及余额读取完成；本轮明细见上表。" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
        }
